
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF Voice Reader</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
body {
  background:#101827;
  color:white;
  font-family:Arial;
  padding:15px;
}
h1 {text-align:center;color:#55d6a5}
.box {
  background:#1e293b;
  padding:16px;
  margin:14px auto;
  border-radius:14px;
  max-width:600px;
}
button,input,select {
  width:100%;
  box-sizing:border-box;
  padding:13px;
  margin:7px 0;
  border:0;
  border-radius:9px;
  font-size:16px;
}
button {
  background:#16a879;
  color:white;
  font-weight:bold;
}
textarea {
  width:100%;
  height:220px;
  box-sizing:border-box;
  padding:12px;
  font-size:17px;
  border-radius:9px;
}
#status {color:#55d6a5}
</style>
</head>
<body>

<h1>📖 قارئ PDF الصوتي</h1>
<p style="text-align:center">العربية والإنجليزية</p>

<div class="box">
<h3>📂 اختر ملف PDF</h3>
<input type="file" id="file" accept=".pdf,application/pdf">
<p id="status">لم يتم اختيار ملف بعد</p>
</div>

<div class="box">
<h3>📄 صفحات الكتاب</h3>
<button id="previous">الصفحة السابقة</button>
<p id="pageInfo">لا يوجد ملف</p>
<button id="next">الصفحة التالية</button>
</div>

<div class="box">
<h3>📝 النص المستخرج</h3>
<textarea id="text" placeholder="سيظهر نص الصفحة هنا"></textarea>
</div>

<div class="box">
<h3>🌍 لغة القراءة</h3>
<select id="lang">
<option value="ar-SA">العربية</option>
<option value="en-US">English</option>
</select>

<h3>سرعة القراءة</h3>
<input type="range" id="speed" min="0.6" max="2" step="0.1" value="1">

<button id="read">▶️ ابدأ القراءة</button>
<button id="pause">⏸ إيقاف مؤقت</button>
<button id="resume">▶️ استكمال</button>
<button id="stop">⏹ إيقاف</button>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let pdf = null;
let page = 1;

const file = document.getElementById('file');
const text = document.getElementById('text');
const status = document.getElementById('status');
const info = document.getElementById('pageInfo');

async function showPage() {
  if (!pdf) return;

  speechSynthesis.cancel();
  status.textContent = 'جاري استخراج النص...';
  text.value = '';

  try {
    const p = await pdf.getPage(page);
    const data = await p.getTextContent();

    text.value = data.items
  .map(item => item.str)
  .join(' ')
  .replace(/[\u200e\u200f]/g, '');

    if (text.value.trim()) {
      status.textContent = 'تم استخراج النص بنجاح';
    } else {
      status.textContent =
        'لا يوجد نص قابل للاستخراج. قد تكون الصفحة مصورة.';
    }

    info.textContent =
      'الصفحة ' + page + ' من ' + pdf.numPages;

  } catch(error) {
    status.textContent = 'حدث خطأ أثناء قراءة الصفحة';
  }
}

file.addEventListener('change', async function(e) {
  const selected = e.target.files[0];
  if (!selected) return;

  status.textContent = 'جاري فتح الملف...';

  try {
    const buffer = await selected.arrayBuffer();

    pdf = await pdfjsLib.getDocument({
      data: new Uint8Array(buffer)
    }).promise;

    page = 1;
    await showPage();

  } catch(error) {
    status.textContent =
      'تعذر فتح الملف. جرب ملف PDF آخر.';
  }
});

document.getElementById('next').onclick = async () => {
  if (pdf && page < pdf.numPages) {
    page++;
    await showPage();
  }
};

document.getElementById('previous').onclick = async () => {
  if (pdf && page > 1) {
    page--;
    await showPage();
  }
};

document.getElementById('read').onclick = () => {
  const value = text.value.trim();

  if (!value) {
    status.textContent = 'لا يوجد نص للقراءة';
    return;
  }

  speechSynthesis.cancel();

  const speech = new SpeechSynthesisUtterance(value);
  speech.lang = document.getElementById('lang').value;
  speech.rate = Number(
    document.getElementById('speed').value
  );

  speechSynthesis.speak(speech);
};

document.getElementById('pause').onclick = () => {
  speechSynthesis.pause();
};

document.getElementById('resume').onclick = () => {
  speechSynthesis.resume();
};

document.getElementById('stop').onclick = () => {
  speechSynthesis.cancel();
};
</script>

</body>
</html>
