
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF Voice Reader</title>
<style>
body {
  background:#101827;
  color:white;
  font-family:Arial;
  padding:20px;
  text-align:center;
}
.box {
  background:#1e293b;
  padding:20px;
  margin:15px auto;
  border-radius:15px;
  max-width:500px;
}
button,input,select {
  width:100%;
  padding:14px;
  margin:8px 0;
  border:0;
  border-radius:9px;
  font-size:16px;
}
button {
  background:#16a879;
  color:white;
}
textarea {
  width:100%;
  height:180px;
  font-size:17px;
}
</style>
</head>
<body>
<h1>📖 قارئ PDF الصوتي</h1>
<div class="box">
<h3>اختر ملف PDF</h3>
<input type="file" id="file" accept=".pdf">
</div>
<div class="box">
<select id="lang">
<option value="ar-SA">العربية</option>
<option value="en-US">English</option>
</select>
<textarea id="text" placeholder="النص المستخرج يظهر هنا"></textarea>
<button onclick="readText()">▶️ ابدأ القراءة</button>
<button onclick="speechSynthesis.pause()">إيقاف مؤقت</button>
<button onclick="speechSynthesis.resume()">استكمال</button>
<button onclick="speechSynthesis.cancel()">إيقاف</button>
</div>
<script>
function readText(){
let t=document.getElementById('text').value;
let u=new SpeechSynthesisUtterance(t);
u.lang=document.getElementById('lang').value;
speechSynthesis.speak(u);
}
</script>
</body>
</html>
